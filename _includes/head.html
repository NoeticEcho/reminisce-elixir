<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{% seo %}
{%- if page.sitemap == false %}
<meta name="robots" content="noindex">
{%- endif %}
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0A0B09" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#E9E3D2" media="(prefers-color-scheme: light)">
<script>
/* Ink or Paper: the reader's last choice, else the system's preference. Runs before the first
   paint so the page never flashes the wrong theme. The key is shared with open.noeticecho.space. */
(function () {
  var t = null;
  try { t = localStorage.getItem("noeticecho.theme"); } catch (e) {}
  if (t !== "ink" && t !== "paper") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "paper" : "ink";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
